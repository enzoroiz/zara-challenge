[versions]
agp = "8.7.3"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
hilt = "2.54"
composeBom = "2025.01.01"
coreKtx = "1.15.0"
activityCompose = "1.10.0"
lifecycle = "2.8.7"
navigationCompose = "2.8.5"
